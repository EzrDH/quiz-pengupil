name: Selenium Test - Modul Login & Register

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium:
    name: Uji Modul Login & Register
    runs-on: ubuntu-latest

    # ---------------------------------------------------------------------
    #  Database yang dipakai modul (setara MariaDB pada XAMPP lokal)
    # ---------------------------------------------------------------------
    services:
      mariadb:
        image: mariadb:10.4
        env:
          # Nama MYSQL_* dipakai (bukan MARIADB_*) karena image mariadb:10.4
          # belum mengenal varian berprefiks MARIADB_.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: quiz_pengupil
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=30s

    env:
      BASE_URL: http://127.0.0.1:8000/
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: ""
      DB_NAME: quiz_pengupil
      HEADLESS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      #  Aplikasi yang diuji (SUT)
      # -------------------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli

      - name: Import skema & data awal database
        run: |
          # Pastikan client mysql tersedia, tidak bergantung pada isi image runner.
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mysql-client
          fi

          # Tunggu database benar-benar menerima koneksi.
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -P 3306 -u root -e "SELECT 1" >/dev/null 2>&1; then
              echo "Database siap."
              break
            fi
            if [ "$i" = "30" ]; then echo "Database tidak merespons."; exit 1; fi
            sleep 2
          done

          mysql -h 127.0.0.1 -P 3306 -u root quiz_pengupil < db/quiz_pengupil.sql
          mysql -h 127.0.0.1 -P 3306 -u root quiz_pengupil -e "SELECT id, username, email FROM users;"

      - name: Sesuaikan host database untuk lingkungan CI
        # koneksi.php sengaja DIBIARKAN UTUH di repository (byte-for-byte sama
        # dengan repo asal). Penyesuaian hanya dilakukan di runner, sesaat
        # sebelum server dijalankan.
        #
        # Alasannya teknis: di Linux, mysqli_connect('localhost', ...) memaksa
        # koneksi lewat Unix socket, sedangkan MariaDB di sini berjalan sebagai
        # service container yang hanya bisa dihubungi lewat TCP 127.0.0.1:3306.
        # Di XAMPP (Windows) 'localhost' sudah berarti TCP, sehingga file asli
        # tetap bekerja tanpa penyesuaian apa pun.
        run: |
          sed -i "s/\$host     = 'localhost';/\$host     = '127.0.0.1';/" koneksi.php
          echo "--- koneksi.php di runner ---"
          cat koneksi.php

      - name: Jalankan web server
        # output_buffering & display_errors disamakan dengan php.ini bawaan
        # XAMPP supaya perilaku modul di CI identik dengan pengujian lokal.
        run: |
          php -S 127.0.0.1:8000 -t . \
              -d output_buffering=4096 \
              -d display_errors=1 \
              -d error_reporting=E_ALL \
              > php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/login.php; then
              echo "Web server siap."
              exit 0
            fi
            sleep 1
          done
          echo "Web server gagal start:"; cat php-server.log; exit 1

      # -------------------------------------------------------------------
      #  Harness pengujian
      # -------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependency pengujian
        run: pip install -r requirements.txt

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      # -------------------------------------------------------------------
      #  Eksekusi test case
      # -------------------------------------------------------------------
      - name: Jalankan test case Selenium
        run: pytest --html=report.html --self-contained-html

      - name: Unggah laporan hasil pengujian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-pengujian
          path: |
            report.html
            php-server.log
          retention-days: 30

      - name: Tampilkan log web server bila pengujian gagal
        if: failure()
        run: cat php-server.log
